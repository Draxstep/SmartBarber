<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1C1C" />
    <meta name="description" content="SmartBarber: Tradición y Oficio de la Barbería Clásica en Bogotá. Agendamiento ágil en bloques de 30 minutos." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts Preconnect & Carga No-Bloqueante CORS (sin respuestas opacas en SW) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      crossorigin="anonymous"
      media="print"
      onload="this.media='all'"
    />

    <!-- Material Symbols Outlined (estático acotado, no bloqueante, CORS) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      crossorigin="anonymous"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        crossorigin="anonymous"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
        crossorigin="anonymous"
      />
    </noscript>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/src/styles/main.css" />

    <title>SmartBarber | Tradición & Oficio en Bogotá</title>
  </head>
  <body class="bg-[#F2EBDD] text-[#1C1C1C] min-h-screen font-sans selection:bg-[#8B1E1E] selection:text-white">
    <div id="app">
      <!-- App Shell inicial para FCP/LCP instantáneo antes de hidratar catálogo -->
      <div class="min-h-screen bg-[#F2EBDD] text-[#1C1C1C] flex flex-col font-sans">
        <header class="sticky top-0 w-full z-50 bg-[#1C1C1C] border-b-2 border-[#8B1E1E]">
          <div class="max-w-[1120px] mx-auto h-16 px-4 sm:px-6 flex items-center justify-between">
            <span class="font-serif text-xl sm:text-2xl font-bold tracking-tight text-[#F2EBDD]">SmartBarber</span>
            <a href="#booking-wizard" class="inline-flex items-center justify-center min-h-[44px] px-4 py-2 rounded-md bg-[#F2EBDD] text-[#1C1C1C] font-semibold text-sm">Agendar Cita</a>
          </div>
        </header>
        <section class="bg-[#1C1C1C] text-[#F2EBDD] py-12 sm:py-16 px-4 border-b-4 border-[#8B1E1E]">
          <div class="max-w-[1120px] mx-auto flex flex-col items-center text-center">
            <h1 class="font-serif text-3xl sm:text-5xl lg:text-6xl font-bold tracking-tight max-w-2xl leading-tight mb-4">
              El Oficio de la Barbería en su Máxima Expresión
            </h1>
            <p class="font-sans text-sm sm:text-base text-[#BDB4A5] max-w-lg mb-8 leading-relaxed">
              Puntualidad en bloques de 30 minutos, navaja de acero quirúrgico y atención personalizada en el corazón de Bogotá.
            </p>
          </div>
        </section>
      </div>
    </div>

    <!-- Script Principal del Portal Público -->
    <script type="module" src="/src/pages/public/main-public.js"></script>
  </body>
</html>
